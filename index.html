<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renewed</title>
  <meta name="description" content="Renewed">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f1e7;
      color: #17352c;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
    }
    main { width: min(680px, calc(100% - 48px)); }
    p.kicker {
      margin: 0 0 14px;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8a6844;
    }
    h1 {
      margin: 0;
      font-weight: 500;
      font-size: clamp(56px, 12vw, 92px);
      line-height: 0.95;
      letter-spacing: -0.03em;
    }
    .rule {
      width: 72px;
      height: 2px;
      margin: 28px 0 22px;
      background: #b8956a;
    }
    p.line {
      margin: 0;
      max-width: 28rem;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #3d4a44;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Website</p>
    <h1>Renewed</h1>
    <div class="rule"></div>
    <p class="line">This is the public home for Renewed.</p>
  </main>
</body>
</html>
